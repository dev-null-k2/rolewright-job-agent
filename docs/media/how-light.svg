<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="How Rolewright runs: job boards, Gmail alerts and public hiring posts feed scheduled Claude tasks, which write checked drafts into a private tracker; you press Send"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2d3ca6"/></marker></defs><rect x="10" y="20" width="230" height="130" rx="12" fill="#ffffff" stroke="#d9dce7" stroke-width="1.5"/><text x="125.0" y="50" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151a2c">Where roles come from</text><text x="125.0" y="74" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">~270 job boards and career sites</text><text x="125.0" y="93" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">LinkedIn, Indeed, Glassdoor alerts</text><text x="125.0" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Public “we’re hiring” posts</text><rect x="10" y="180" width="230" height="130" rx="12" fill="#ffffff" stroke="#d9dce7" stroke-width="1.5"/><text x="125.0" y="210" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151a2c">Your facts</text><text x="125.0" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Resume (the only source of truth)</text><text x="125.0" y="253" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Profile: roles, cities, never-say list</text><text x="125.0" y="272" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Claude Project, private to you</text><rect x="300" y="20" width="280" height="290" rx="12" fill="#ffffff" stroke="#d9dce7" stroke-width="1.5"/><text x="440.0" y="50" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151a2c">Claude scheduled tasks</text><text x="440.0" y="74" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Job scan, twice a day</text><text x="440.0" y="93" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">scores fit 1–5, finds published emails</text><text x="440.0" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">writes messages, resumes, cover letters</text><text x="440.0" y="131" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">checker blocks invented numbers</text><text x="440.0" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077"></text><text x="440.0" y="169" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Inbox watch, every hour</text><text x="440.0" y="188" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">reads replies, updates statuses</text><text x="440.0" y="207" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077"></text><text x="440.0" y="226" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Weekly review, Sunday</text><text x="440.0" y="245" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">reply rates, what to change</text><rect x="660" y="20" width="230" height="170" rx="12" fill="#ffffff" stroke="#d9dce7" stroke-width="1.5"/><text x="775.0" y="50" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151a2c">Your private tracker</text><text x="775.0" y="74" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Today’s 10, one role at a time</text><text x="775.0" y="93" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Pipeline, Ask box, Apply kit</text><text x="775.0" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Tailored resume with every</text><text x="775.0" y="131" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">change marked</text><rect x="660" y="220" width="230" height="90" rx="12" fill="#ffffff" stroke="#8f6310" stroke-width="2"/><text x="775.0" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#151a2c">You press Send</text><text x="775.0" y="274" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">Nothing goes out</text><text x="775.0" y="293" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6077">without your click</text><line x1="240" y1="85" x2="297" y2="110" stroke="#2d3ca6" stroke-width="2" marker-end="url(#a)"/><line x1="240" y1="245" x2="297" y2="220" stroke="#2d3ca6" stroke-width="2" marker-end="url(#a)"/><line x1="580" y1="105" x2="657" y2="105" stroke="#2d3ca6" stroke-width="2" marker-end="url(#a)"/><line x1="775" y1="190" x2="775" y2="217" stroke="#2d3ca6" stroke-width="2" marker-end="url(#a)"/></svg>